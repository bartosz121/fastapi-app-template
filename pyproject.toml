[project]
name = "todo-api"
dynamic = ["version"]
requires-python = ">=3.14"
description = ""
authors = [{ name = "bartosz121", email = "bmagiera121@gmail.com" }]
readme = "README.md"
dependencies = [
    "fastapi==0.141.1",
    "argon2-cffi==25.1.0",
    "passlib==1.7.4",
    "prometheus-client==0.26.0",
    "pydantic-settings==2.15.0",
    "sqlalchemy[asyncio]==2.0.52",
    "structlog==26.1.0",
    "alembic==1.19.1",
    "poethepoet==0.48.0",
    "granian[reload,uvloop]==2.8.2",
    "opentelemetry-api==1.44.0",
    "opentelemetry-sdk==1.44.0",
    "opentelemetry-semantic-conventions==0.65b0",
    "opentelemetry-instrumentation-fastapi==0.65b0",
    "opentelemetry-instrumentation-sqlalchemy==0.65b0",
    "opentelemetry-exporter-otlp==1.44.0",
    "wrapt==1.17.3",
    "psycopg[c]==3.3.5",
]


[dependency-groups]
dev = [
    "ruff==0.16.5",
    "pyright==1.1.411",
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "pytest-mock==3.15.1",
    "pytest-sugar==1.1.1",
    "coverage[toml]==7.16.0",
    "faker==40.38.0",
    "hypothesis==6.167.1",
    "types-passlib==1.7.7.20260211",
    "sqlalchemy-utils==0.42.1",
    "httpx>=0.28.1,<0.29",
    "pytest-asyncio==1.4.0",
    "asgi-lifespan==2.1.0",
    "jinja2==3.1.6",
    "pytest-env==1.7.0",
    "pytest-xdist==3.8.0",
]

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.uv]
exclude-newer = "1 week"

[tool.hatch.version]
source = "vcs"

[tool.hatch.version.raw-options]
version_scheme = "no-guess-dev"
fallback_version = "0.0.0"

[tool.hatch.build.hooks.vcs]
version-file = "todo_api/_version.py"

[tool.ruff]
line-length = 99

[tool.ruff.lint]
extend-select = ["Q", "RUF100", "C90", "UP", "I", "T20", "FAST", "ANN", "ASYNC"]
isort = { combine-as-imports = true }
mccabe = { max-complexity = 15 }

[tool.ruff.lint.per-file-ignores]
# `Missing return type annotation for public function`
# I prefer `response_model` over endpoint function return type hint
"**/router.py" = ["ANN201"]
"**/routers/*.py" = ["ANN201"]
"tests/**" = ["ANN201", "ANN202"]

[tool.pyright]
pythonVersion = "3.14"
typeCheckingMode = "strict"
reportUnnecessaryTypeIgnoreComment = true
venvPath = ".venv"
exclude = [
    "todo_api/version.py",
    ".venv",
    "**/__pycache____",
    "**/.pytest_cache__",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self\\.debug",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]


[tool.pytest]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = ["auth", "db"]
filterwarnings = [
    "ignore:Accessing argon2.__version__ is deprecated:DeprecationWarning:passlib.handlers.argon2",
    # This happens because the app is initialized for each test, which is fine for testing
    "ignore:Repeated configuration attempted:RuntimeWarning:todo_api.core.logging",
]
env = [
    "ENVIRONMENT=TESTING",
    "DB_DATABASE=todo_api_test",
    "PROMETHEUS_ENABLED=false",
    "U:PROMETHEUS_MULTIPROC_DIR=",
    "U:prometheus_multiproc_dir=",
]

[tool.poe.tasks]
format = { shell = "ruff format $POE_EXTRA_ARGS && ruff check --fix $POE_EXTRA_ARGS" }
lint = { shell = "ruff format --check $POE_EXTRA_ARGS && ruff check $POE_EXTRA_ARGS" }
typecheck = "pyright --warnings $POE_EXTRA_ARGS"
test = "pytest -vv -n auto"
cli = "python -m todo_api.cli"
